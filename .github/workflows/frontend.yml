name: Frontend

on:
  push:
    branches: [main]
    paths: [frontend/**, backend/openapi.yaml, .github/workflows/frontend.yml]
  pull_request:
    paths: [frontend/**, backend/openapi.yaml, .github/workflows/frontend.yml]

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: API types match the schema
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.ts
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npx vite build
