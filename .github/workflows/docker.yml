name: Docker

# Only when something that goes into the image's setup changes; app code is
# already covered by the backend and frontend workflows.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - backend/requirements.txt
      - frontend/package-lock.json
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - backend/requirements.txt
      - frontend/package-lock.json
      - .github/workflows/docker.yml

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: truck-routing
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image and check it serves the app and the API
        run: |
          docker run -d --name app -p 8000:8000 -e DJANGO_SECRET_KEY=ci-only-${{ github.sha }} truck-routing
          for i in $(seq 1 20); do curl -fs localhost:8000/api/health/ && break; sleep 1; done
          curl -fs localhost:8000/api/health/
          curl -fs localhost:8000/ | grep -q '<div id="root">'
      - if: failure()
        run: docker logs app
